# default-terminal bên trong tmux phải là tmux/screen; RGB của Foot khai báo qua terminal-features
set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB:usstyle"

# Thanh tab kiểu editor ở trên cùng: tab đang chọn chữ trắng + gạch chân tím, bấm × để đóng
set -g status-position top
set -g status-style "bg=#32323a,fg=#c2c2c4"
set -g status-left ""
set -g status-right ""
set -g window-status-separator ""
# Hai format cùng độ rộng (W+7) để tab không xô lệch khi đổi tab; range k<index> là vùng bấm của ×
set -g window-status-format " #[fg=#c2c2c4,bold] #W  #[range=user|k#{window_index}]#[fg=#8b8b90]×#[range=window|#{window_index}]  "
set -g window-status-current-format "#[fg=#424249]│#[fg=#ffffff,bold,us=#5657f5,underscore] #W  #[range=user|k#{window_index}]#[fg=#b5b5b9]×#[range=window|#{window_index}] #[nounderscore,fg=#424249]│"
# Thanh tab cao 2 hàng: hàng 1 là phần đệm cùng độ rộng tab (bấm vẫn chuyển tab), hàng 2 là nhãn để gạch chân nằm sát nội dung
# shortcut: bỏ list/marker < > của format mặc định, quá nhiều tab tràn chiều ngang thì bị cắt — cần thì chép lại format mặc định
set -g status 2
set -g status-format[0] "#{W:#[range=window|#{window_index}]#{R: ,#{w;T:window-status-format}}#[norange default],#[range=window|#{window_index}]#[fg=#424249]│#{R: ,#{e|-:#{w;T:window-status-current-format},2}}│#[norange default]}"
set -g status-format[1] "#{W:#[range=window|#{window_index}]#{T:window-status-format}#[norange default],#[range=window|#{window_index}]#{T:window-status-current-format}#[norange default]}"
bind -n MouseDown1Status if -F "#{m:k*,#{mouse_status_range}}" "run -C 'kill-window -t :#{s/^k//:mouse_status_range}'" "switch-client -t ="

# Đổi chỉ số Tab bắt đầu từ 1 thay vì 0 cho dễ bấm
set -g base-index 1
setw -g pane-base-index 1

# Bật chuột (để click chuyển tab, cuộn trang, đổi kích thước pane)
set -g mouse on

# Tắt thời gian chờ sau khi bấm ESC (giúp dùng Neovim/Vim không bị trễ)
set -s escape-time 0

# Phím tắt quản lý Tab (Windows):
# Alt + T: Tạo Tab mới
bind -n M-t new-window -c "#{pane_current_path}"

# Alt + W: Đóng pane hiện tại
bind -n M-w kill-pane

# Alt + Số (1-9): Chuyển nhanh đến Tab tương ứng
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# Ctrl + Tab và Ctrl + Shift + Tab: Chuyển Tab kế tiếp / trước đó
bind -n C-Tab next-window
bind -n C-S-Tab previous-window

# Phím tắt chia màn hình (Splits):
# Alt + = (chia dọc) và Alt + - (chia ngang)
bind -n M-= split-window -h -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"
